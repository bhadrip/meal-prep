name: UI tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install backend
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install -e 'backend[dev]'
      - name: Install UI dependencies
        run: pnpm install --frozen-lockfile
      - name: Install desktop and mobile browser engines
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Run backend tests
        run: backend/.venv/bin/python -m pytest backend/tests
      - name: Run UI tests
        run: pnpm test:ui
      - name: Upload failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  supabase-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: supabase/setup-cli@v3
        with:
          version: 2.118.0
      - name: Install backend
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install -e 'backend[dev]'
      - name: Start local Supabase and apply migrations
        run: |
          supabase start --workdir backend
          supabase migration up --local --workdir backend
      - name: Test authenticated plan and weekly rhythm roundtrip
        run: backend/.venv/bin/python backend/scripts/test-local-supabase.py
      - name: Verify signal capture, rollback and household isolation
        run: MEAL_PREP_TEST_SQL_CONTAINER=supabase_db_meal-prep backend/.venv/bin/pytest backend/tests/test_signal_sql.py -q
