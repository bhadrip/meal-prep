<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Authorize Meal Prep</title>
    <style>
      :root { font-family:ui-sans-serif,system-ui,sans-serif; color:#17211e; background:#f5f7f2; }
      * { box-sizing:border-box; }
      body { min-height:100vh; margin:0; display:grid; place-items:center; padding:24px; }
      main { width:min(520px,100%); background:white; border:1px solid #dfe5de; border-radius:24px; padding:32px; box-shadow:0 18px 45px rgba(29,56,47,.1); }
      h1 { margin:0; font-family:Georgia,serif; }
      p,li { color:#64716c; line-height:1.5; }
      .actions { display:flex; gap:10px; margin-top:24px; }
      button { min-height:46px; padding:0 18px; border-radius:12px; border:1px solid #173f35; font:inherit; font-weight:700; cursor:pointer; }
      .approve { background:#173f35; color:white; }
      .deny { background:white; color:#173f35; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="/static/oauth-consent.js" defer></script>
  </head>
  <body>
    <main>
      <h1>Authorize Meal Prep</h1>
      <p id="summary">Loading authorization request…</p>
      <ul id="scopes"></ul>
      <div class="actions" hidden>
        <button class="approve" data-decision="approve">Allow access</button>
        <button class="deny" data-decision="deny">Deny</button>
      </div>
      <p id="message" role="status"></p>
    </main>
  </body>
</html>
