<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#252a40" />
    <title>Sign in · Meal Prep</title>
    <link rel="icon" type="image/svg+xml" href="/static/meal-prep-icon.svg" />
    <link rel="stylesheet" href="/static/typography.css?v=1" />
    <style>
      :root { font-family:var(--font-body); color:#25283b; background:#252a40; }
      * { box-sizing:border-box; }
      body { min-height:100vh; margin:0; display:grid; place-items:center; padding:24px; background:repeating-linear-gradient(128deg,transparent 0 36px,rgba(255,255,255,.035) 37px 38px),#252a40; }
      main { width:min(460px,100%); background:#fffcf7; border:1px solid #dedbd5; border-radius:14px; padding:clamp(28px,5vw,44px); box-shadow:0 24px 75px rgba(15,17,30,.24); }
      .back { display:inline-flex; align-items:center; gap:10px; color:#626981; font-size:.78rem; font-weight:700; text-decoration:none; }
      .back img { width:34px; height:34px; border-radius:6px; background:#252a40; }
      .back:hover { color:#b6674e; }
      .eyebrow { margin:38px 0 8px; color:#b6674e; font-family:var(--font-label); font-size:.62rem; font-weight:500; letter-spacing:.08em; text-transform:uppercase; }
      h1 { margin:0; font-family:var(--font-display); font-size:2.65rem; font-weight:780; letter-spacing:-.06em; line-height:1; }
      p { color:#737583; line-height:1.55; }
      form { display:grid; gap:10px; margin-top:28px; }
      label { color:#55596d; font-size:.76rem; font-weight:700; }
      input,button { min-height:48px; border-radius:9px; font:inherit; }
      input { border:1px solid #c9c8cc; padding:0 14px; background:white; color:#25283b; }
      input:focus-visible { outline:2px solid #56658c; outline-offset:2px; }
      button { margin-top:6px; border:0; background:#29324c; color:white; font-weight:700; cursor:pointer; }
      button:hover { background:#3d486b; }
      #message { min-height:24px; margin-bottom:0; font-size:.78rem; }
    </style>
    <script src="/static/vendor/supabase.js" defer></script>
    <script src="/static/login.js?v=3" defer></script>
  </head>
  <body>
    <main>
      <a class="back" href="/"><img src="/static/meal-prep-icon.svg" alt="" />Meal Prep</a>
      <p class="eyebrow">Your household, organized</p>
      <h1>Sign in or sign up</h1>
      <p>Enter your email. We’ll send a secure link to sign in or create your account.</p>
      <form id="login-form">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com" />
        <button type="submit">Send magic link</button>
      </form>
      <p id="message" role="status"></p>
    </main>
  </body>
</html>
