<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --accent: #1d5a49;
        --accent-soft: color-mix(in srgb, Canvas 88%, #9ed7bc);
        --gold-soft: color-mix(in srgb, Canvas 86%, #f2cf66);
        --clay-soft: color-mix(in srgb, Canvas 87%, #e7a484);
        --line: color-mix(in srgb, CanvasText 14%, transparent);
        --muted: color-mix(in srgb, CanvasText 64%, transparent);
        --surface: color-mix(in srgb, Canvas 96%, var(--accent));
        --soft: color-mix(in srgb, Canvas 92%, var(--accent));
      }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 14px; background: Canvas; color: CanvasText; }
      button, input { font: inherit; }
      h1, h2, h3, p { margin: 0; }
      header { display:flex; justify-content:space-between; gap:12px; align-items:end; margin-bottom:12px; }
      header h1 { font-size:1.05rem; }
      header p { margin:.25rem 0 0; opacity:.7; font-size:.82rem; }
      .grid { display:grid; grid-template-columns:repeat(7,minmax(110px,1fr)); gap:8px; overflow-x:auto; padding-bottom:4px; }
      .day,.group { border:1px solid var(--line); border-radius:14px; padding:12px; background:var(--surface); }
      .day small,.group h2 { display:block; margin:0 0 9px; opacity:.65; text-transform:uppercase; letter-spacing:.08em; font-size:.68rem; }
      .day strong { display:block; line-height:1.25; }
      .day span { display:block; margin-top:6px; opacity:.72; font-size:.76rem; }
      .groups { display:grid; gap:10px; }
      .items { display:grid; gap:7px; }
      label { display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:9px; }
      label.done span { text-decoration:line-through; opacity:.55; }
      button { border:0; border-radius:10px; padding:8px 11px; background:var(--accent); color:white; font-weight:650; cursor:pointer; }
      .empty { padding:22px; border:1px dashed var(--line); border-radius:14px; text-align:center; color:var(--muted); }
      .snapshot { display:grid; gap:12px; }
      .snapshot-head { display:flex; align-items:center; justify-content:space-between; gap:12px; }
      .identity { display:flex; align-items:center; gap:11px; min-width:0; }
      .identity-mark { display:grid; place-items:center; flex:0 0 auto; width:42px; height:42px; border-radius:14px; background:var(--accent); color:white; font-weight:800; }
      .identity h1 { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:1.08rem; }
      .identity p { margin-top:3px; color:var(--muted); font-size:.76rem; }
      .owner-badge { flex:0 0 auto; padding:5px 8px; border-radius:999px; background:var(--accent-soft); color:var(--accent); font-size:.68rem; font-weight:750; }
      .tabs { display:grid; grid-template-columns:repeat(6,1fr); gap:4px; padding:4px; border:1px solid var(--line); border-radius:12px; background:var(--surface); }
      .tabs button { padding:7px 8px; border-radius:8px; background:transparent; color:var(--muted); font-size:.75rem; }
      .tabs button.active { background:var(--accent); color:white; }
      .tab-panel { display:grid; gap:10px; }
      .signal-grid { display:grid; grid-template-columns:1.15fr .85fr; gap:10px; }
      .signal-card { min-width:0; padding:13px; border:1px solid var(--line); border-radius:14px; background:var(--surface); }
      .signal-title { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:9px; }
      .signal-title div { display:flex; align-items:center; gap:7px; }
      .signal-icon { display:grid; place-items:center; width:25px; height:25px; border-radius:8px; background:var(--accent-soft); color:var(--accent); font-weight:800; }
      .signal-card h2 { font-size:.82rem; }
      .count-badge { padding:3px 7px; border-radius:999px; background:color-mix(in srgb, CanvasText 7%, transparent); color:var(--muted); font-size:.64rem; font-weight:700; }
      .chip-cloud { display:flex; flex-wrap:wrap; gap:6px; }
      .chip { padding:5px 7px; border-radius:999px; background:var(--clay-soft); font-size:.69rem; font-weight:650; }
      .chip.allow { background:var(--accent-soft); color:var(--accent); }
      .fact-list { display:grid; gap:7px; margin:0; padding:0; list-style:none; }
      .fact-list li { display:flex; align-items:flex-start; gap:7px; color:var(--muted); font-size:.73rem; line-height:1.35; }
      .fact-list li::before { content:"✓"; color:var(--accent); font-weight:800; }
      .store-row { display:flex; align-items:center; gap:7px; margin-top:9px; }
      .store { display:flex; align-items:center; gap:5px; min-width:0; padding:5px 7px; border:1px solid var(--line); border-radius:9px; font-size:.69rem; }
      .store b { display:grid; place-items:center; width:16px; height:16px; border-radius:50%; background:var(--gold-soft); font-size:.6rem; }
      .data-strip { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; }
      .data-tile { min-width:0; padding:9px; border:1px solid var(--line); border-radius:11px; background:Canvas; color:CanvasText; text-align:left; }
      .data-tile strong,.data-tile small { display:block; }
      .data-tile strong { font-size:.86rem; }
      .data-tile small { margin-top:2px; overflow:hidden; color:var(--muted); font-size:.63rem; text-overflow:ellipsis; white-space:nowrap; }
      .data-tile.unavailable strong { color:var(--muted); }
      .section-head { display:flex; align-items:center; justify-content:space-between; gap:10px; }
      .section-head h2 { font-size:.88rem; }
      .section-head span { color:var(--muted); font-size:.68rem; }
      .compact-list { display:grid; gap:6px; }
      .compact-row { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px; align-items:center; padding:9px 10px; border:1px solid var(--line); border-radius:11px; background:var(--surface); }
      .compact-row strong,.compact-row small { display:block; }
      .compact-row strong { overflow:hidden; font-size:.77rem; text-overflow:ellipsis; white-space:nowrap; }
      .compact-row small { margin-top:2px; color:var(--muted); font-size:.67rem; }
      .row-meta { color:var(--muted); font-size:.68rem; white-space:nowrap; }
      .week-grid { display:grid; grid-template-columns:repeat(7,minmax(70px,1fr)); gap:6px; overflow-x:auto; }
      .week-day { min-width:70px; padding:8px; border:1px solid var(--line); border-radius:10px; background:var(--surface); }
      .week-day strong,.week-day small { display:block; }
      .week-day strong { font-size:.7rem; }
      .week-day small { margin-top:6px; color:var(--muted); font-size:.64rem; text-transform:capitalize; }
      .memory-row { padding:10px; border:1px solid var(--line); border-radius:11px; background:var(--surface); }
      .memory-row p { margin-top:6px; font-size:.76rem; line-height:1.35; }
      .memory-meta { display:flex; align-items:center; justify-content:space-between; gap:8px; }
      .memory-meta span { color:var(--muted); font-size:.63rem; text-transform:capitalize; }
      .status { padding:3px 6px; border-radius:999px; background:var(--accent-soft); color:var(--accent)!important; font-weight:750; }
      .status.suggested { background:var(--gold-soft); color:color-mix(in srgb, CanvasText 80%, #8b6a00)!important; }
      .callout { padding:14px; border:1px dashed var(--line); border-radius:13px; text-align:center; }
      .callout strong { display:block; font-size:.82rem; }
      .callout p { max-width:420px; margin:4px auto 0; color:var(--muted); font-size:.72rem; line-height:1.4; }
      .recipe-library { display:grid; gap:12px; }
      .recipe-library-head { display:flex; align-items:flex-end; justify-content:space-between; gap:12px; }
      .recipe-library-head h1 { font-size:1.08rem; }
      .recipe-library-head p { margin-top:3px; color:var(--muted); font-size:.72rem; }
      .recipe-search { position:relative; width:min(240px,48%); }
      .recipe-search input { min-height:38px; padding-left:32px; }
      .recipe-search span { position:absolute; left:11px; top:50%; translate:0 -50%; color:var(--muted); font-size:.8rem; pointer-events:none; }
      .recipe-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
      .recipe-card { display:grid; grid-template-columns:52px minmax(0,1fr); gap:11px; min-width:0; padding:11px; border:1px solid var(--line); border-radius:14px; background:var(--surface); color:CanvasText; text-align:left; }
      .recipe-card:hover { border-color:color-mix(in srgb, var(--accent) 55%, var(--line)); }
      .recipe-art { display:grid; place-items:center; width:52px; height:52px; border-radius:13px; background:linear-gradient(145deg,var(--gold-soft),var(--clay-soft)); color:color-mix(in srgb, CanvasText 74%, var(--accent)); font-size:1.15rem; font-weight:850; }
      .recipe-card:nth-child(3n+2) .recipe-art { background:linear-gradient(145deg,var(--accent-soft),var(--gold-soft)); }
      .recipe-card:nth-child(3n+3) .recipe-art { background:linear-gradient(145deg,var(--clay-soft),var(--accent-soft)); }
      .recipe-card-copy { min-width:0; }
      .recipe-card h3 { overflow:hidden; font-size:.82rem; text-overflow:ellipsis; white-space:nowrap; }
      .recipe-card p { display:-webkit-box; min-height:2.5em; margin-top:4px; overflow:hidden; color:var(--muted); font-size:.68rem; line-height:1.25; -webkit-box-orient:vertical; -webkit-line-clamp:2; }
      .recipe-facts { display:flex; flex-wrap:wrap; gap:5px 9px; margin-top:7px; color:var(--muted); font-size:.64rem; }
      .recipe-tags { display:flex; flex-wrap:wrap; gap:5px; margin-top:8px; }
      .recipe-tag { padding:3px 6px; border-radius:999px; background:var(--accent-soft); color:var(--accent); font-size:.6rem; font-weight:700; }
      .recipe-detail { display:grid; gap:14px; }
      .recipe-back { justify-self:start; display:flex; align-items:center; gap:6px; padding:7px 10px; background:transparent; border:1px solid var(--line); color:CanvasText; font-size:.7rem; }
      .recipe-hero { display:grid; grid-template-columns:64px minmax(0,1fr); gap:13px; align-items:center; padding:14px; border:1px solid var(--line); border-radius:16px; background:var(--surface); }
      .recipe-hero .recipe-art { width:64px; height:64px; font-size:1.35rem; }
      .recipe-hero h1 { font-size:1.12rem; line-height:1.2; }
      .recipe-hero p { margin-top:5px; color:var(--muted); font-size:.74rem; line-height:1.4; }
      .recipe-columns { display:grid; grid-template-columns:.9fr 1.1fr; gap:12px; }
      .recipe-section { padding:13px; border:1px solid var(--line); border-radius:14px; background:var(--surface); }
      .recipe-section h2 { margin-bottom:10px; font-size:.82rem; }
      .recipe-list,.recipe-steps { display:grid; gap:8px; margin:0; padding:0; list-style:none; }
      .recipe-list li { display:flex; justify-content:space-between; gap:10px; padding-bottom:7px; border-bottom:1px solid var(--line); font-size:.7rem; line-height:1.35; }
      .recipe-list li:last-child { padding-bottom:0; border-bottom:0; }
      .recipe-list small { color:var(--muted); white-space:nowrap; }
      .recipe-steps { counter-reset:step; }
      .recipe-steps li { display:grid; grid-template-columns:22px 1fr; gap:8px; color:var(--muted); font-size:.7rem; line-height:1.4; counter-increment:step; }
      .recipe-steps li::before { content:counter(step); display:grid; place-items:center; width:22px; height:22px; border-radius:7px; background:var(--accent-soft); color:var(--accent); font-size:.62rem; font-weight:800; }
      .recipe-source { color:var(--accent); font-size:.68rem; font-weight:700; text-decoration:none; }
      .recipe-notes { display:grid; gap:8px; }
      .recipe-note { padding:9px 10px; border-left:3px solid var(--accent); border-radius:8px; background:var(--soft); }
      .recipe-note p { color:var(--muted); font-size:.7rem; line-height:1.4; }
      .recipe-note small { display:block; margin-top:5px; color:var(--accent); font-size:.64rem; font-weight:700; }
      .retro-card { padding:13px; border:1px solid var(--line); border-radius:14px; background:var(--surface); }
      .retro-card h3 { font-size:.78rem; }
      .retro-card > p { margin-top:6px; color:var(--muted); font-size:.72rem; line-height:1.4; }
      .retro-summary { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
      .retro-list { display:grid; gap:7px; margin:9px 0 0; padding:0; list-style:none; }
      .retro-list li { display:grid; grid-template-columns:17px 1fr; gap:7px; color:var(--muted); font-size:.7rem; line-height:1.35; }
      .retro-list li::before { content:"✓"; color:var(--accent); font-weight:800; }
      .retro-card.stress .retro-list li::before { content:"!"; color:color-mix(in srgb, CanvasText 72%, #b54708); }
      .feedback-list { display:grid; gap:8px; }
      .feedback-row { padding:10px 11px; border:1px solid var(--line); border-radius:11px; background:var(--surface); }
      .feedback-row-head { display:flex; align-items:center; justify-content:space-between; gap:9px; }
      .feedback-row strong { font-size:.74rem; }
      .feedback-row p { margin-top:5px; color:var(--muted); font-size:.7rem; line-height:1.4; }
      .feedback-row small { color:var(--muted); font-size:.62rem; text-transform:capitalize; }
      .next-time { display:block; margin-top:6px; color:var(--accent)!important; font-weight:700; }
      @media (max-width:700px) {
        .grid { grid-template-columns:repeat(7,150px); }
        .signal-grid { grid-template-columns:1fr; }
        .data-strip { grid-template-columns:repeat(2,1fr); }
        .recipe-grid,.recipe-columns,.retro-summary { grid-template-columns:1fr; }
        .tabs { grid-template-columns:repeat(6,minmax(86px,1fr)); overflow-x:auto; }
      }
      .onboarding { max-width:760px; margin:0 auto; }
      .onboarding-hero { padding:18px; border-radius:18px; background:var(--soft); }
      .onboarding-hero h1 { font-size:1.35rem; line-height:1.15; }
      .onboarding-hero p { max-width:620px; line-height:1.45; }
      .coverage { display:grid; grid-template-columns:repeat(6,1fr); gap:6px; margin-top:15px; }
      .coverage span { min-height:42px; display:grid; place-items:center; padding:7px; border:1px solid var(--line); border-radius:10px; background:Canvas; font-size:.7rem; font-weight:650; text-align:center; }
      .setup-form { display:grid; gap:18px; margin-top:18px; }
      fieldset { margin:0; padding:0 0 18px; border:0; border-bottom:1px solid var(--line); }
      legend { margin-bottom:5px; font-size:.92rem; font-weight:700; }
      .field-note { margin:0 0 11px; }
      .form-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
      .field { display:grid; grid-template-columns:1fr; gap:6px; align-content:start; color:color-mix(in srgb, CanvasText 72%, transparent); font-size:.76rem; font-weight:650; }
      input[type="text"],input[type="number"],input[type="search"],select { width:100%; min-height:42px; padding:9px 10px; border:1px solid var(--line); border-radius:10px; background:Canvas; color:CanvasText; font:inherit; }
      .choice-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; }
      .choice { position:relative; display:block; }
      .choice input { position:absolute; opacity:0; }
      .choice span { min-height:45px; display:grid; place-items:center; padding:8px; border:1px solid var(--line); border-radius:11px; background:Canvas; color:CanvasText; font-size:.74rem; text-align:center; }
      .choice input:checked + span { border-color:var(--accent); background:var(--soft); box-shadow:inset 0 0 0 1px var(--accent); }
      .choice input:focus-visible + span { outline:2px solid CanvasText; outline-offset:2px; }
      .form-actions { display:flex; align-items:center; justify-content:space-between; gap:14px; }
      .form-actions p { max-width:460px; margin:0; }
      .form-actions button { min-height:42px; white-space:nowrap; }
      .form-error { color:#b42318; opacity:1; }
      .success { padding:24px; border-radius:18px; background:var(--soft); text-align:center; }
      .success h1 { margin-bottom:8px; }
      .success p { max-width:560px; margin-inline:auto; line-height:1.45; }
      @media (max-width:700px) {
        .grid { grid-template-columns:repeat(7,150px); }
        .coverage { grid-template-columns:repeat(3,1fr); }
        .form-grid,.choice-grid { grid-template-columns:1fr 1fr; }
        .form-actions { display:grid; }
        .form-actions button { width:100%; }
      }
      @media (max-width:420px) { .form-grid,.choice-grid { grid-template-columns:1fr; } }
    </style>
  </head>
  <body>
    <main id="root"><div class="empty">Loading meal-prep data…</div></main>
    <script type="module">
      const root = document.querySelector('#root');
      let requestId = 0;
      let householdSnapshot = null;
      let recipeLibrary = [];
      const pending = new Map();
      const escapeHtml = (value) => String(value ?? '').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
      const pick = (object, ...keys) => keys.map((key) => object?.[key]).find((value) => value !== undefined && value !== null);
      const asArray = (value) => Array.isArray(value) ? value : [];
      const humanize = (value) => String(value || '').replaceAll('_', ' ').replace(/([a-z])([A-Z])/g, '$1 $2').replace(/^./, (letter) => letter.toUpperCase());
      const safeHttpUrl = (value) => { try { const url = new URL(value); return ['http:', 'https:'].includes(url.protocol) ? url.href : ''; } catch { return ''; } };

      function rpc(method, params = {}) {
        const id = ++requestId;
        return new Promise((resolve, reject) => {
          pending.set(id, { resolve, reject });
          window.parent.postMessage({ jsonrpc: '2.0', id, method, params }, '*');
        });
      }

      function notify(method, params = {}) {
        window.parent.postMessage({ jsonrpc: '2.0', method, params }, '*');
      }

      function renderPlan(plan) {
        if (!plan) return '<div class="empty">No meal plan has been saved yet.</div>';
        const entries = (plan.entries || []).map((entry) => `<article class="day"><small>${escapeHtml(entry.day || entry.date)}</small><strong>${escapeHtml(entry.meal || entry.title)}</strong><span>${escapeHtml(entry.servings || '')}${entry.servings ? ' servings' : ''}</span></article>`).join('');
        return `<header><div><h1>Weekly meal plan</h1><p>Week of ${escapeHtml(plan.weekStart || plan.week_start || '')}</p></div></header><section class="grid">${entries}</section>`;
      }

      function renderShopping(list) {
        if (!list) return '<div class="empty">No shopping list has been saved yet.</div>';
        const grouped = (list.items || []).reduce((result, item) => {
          const store = item.store || item.store_name || 'Other';
          (result[store] ||= []).push(item);
          return result;
        }, {});
        const groups = Object.entries(grouped).map(([store, items]) => `<section class="group"><h2>${escapeHtml(store)}</h2><div class="items">${items.map((item) => `<label class="${item.purchased ? 'done' : ''}"><input type="checkbox" data-item-id="${escapeHtml(item.id)}" ${item.purchased ? 'checked' : ''}><span>${escapeHtml(item.name)}</span><small>${escapeHtml(item.quantity || '')} ${escapeHtml(item.unit || '')}</small></label>`).join('')}</div></section>`).join('');
        return `<header><div><h1>${escapeHtml(list.name || 'Shopping list')}</h1><p>Grouped in household store-priority order</p></div></header><section class="groups">${groups}</section>`;
      }

      function sectionValue(name) { return householdSnapshot?.sections?.[name]?.value; }
      function sectionStatus(name) { return householdSnapshot?.sections?.[name]?.status || 'unavailable'; }
      function dataCount(name) {
        const value = sectionValue(name);
        if (Array.isArray(value)) return value.length;
        if (Array.isArray(value?.items)) return value.items.length;
        if (Array.isArray(value?.entries)) return value.entries.length;
        return value ? 1 : 0;
      }

      function planningFacts(preferences) {
        const facts = [];
        const maxMinutes = pick(preferences, 'weeknightMaxMinutes', 'weeknight_max_minutes');
        const leftovers = pick(preferences, 'leftoversForLunch', 'leftovers_for_lunch');
        if (maxMinutes) facts.push(`${maxMinutes} minute weeknight maximum`);
        if (leftovers === true) facts.push('Plan dinner leftovers for lunch');
        if (leftovers === false) facts.push('Lunch leftovers are optional');
        [preferences.mealPriorities, preferences.meal_priorities, preferences.everyMealIncludes, preferences.every_meal_includes]
          .flatMap(asArray).slice(0, 3).forEach((item) => facts.push(typeof item === 'string' ? item : item.title || item.name));
        [preferences.weekdayStyle, preferences.weekday_style, preferences.proteinPreference, preferences.protein_preference]
          .filter(Boolean).slice(0, 2).forEach((item) => facts.push(String(item)));
        return [...new Set(facts.filter(Boolean))].slice(0, 5);
      }

      function renderOverview() {
        const household = householdSnapshot.household || {};
        const restrictions = asArray(pick(household, 'dietaryRestrictions', 'dietary_restrictions'));
        const preferences = pick(household, 'planningPreferences', 'planning_preferences') || {};
        const facts = planningFacts(preferences);
        const stores = asArray(pick(household, 'storePriority', 'store_priority'));
        const ruleChips = restrictions.slice(0, 4).map((rule) => `<span class="chip">${escapeHtml(rule)}</span>`).join('') + (restrictions.length > 4 ? `<span class="chip">+${restrictions.length - 4} more</span>` : '');
        const storeMarkup = stores.slice(0, 3).map((item, index) => `<span class="store"><b>${escapeHtml(item.priority || index + 1)}</b>${escapeHtml(item.store || item.name || item)}</span>`).join('');
        const tiles = [
          ['pantry', dataCount('pantry'), 'Pantry'],
          ['recipes', dataCount('recipes'), 'Recipes'],
          ['week', sectionStatus('schedule') === 'unavailable' ? '—' : dataCount('schedule'), 'Schedule'],
          ['reviews', sectionStatus('retro') === 'unavailable' ? '—' : dataCount('retro'), 'Latest retro'],
          ['reviews', sectionStatus('feedback') === 'unavailable' ? '—' : dataCount('feedback'), 'Feedback'],
          ['week', dataCount('mealPlan'), 'Meal plan'],
          [null, dataCount('shoppingList'), 'Shopping lists'],
          ['memory', sectionStatus('memories') === 'unavailable' ? '—' : dataCount('memories'), 'Memories'],
        ].map(([tab, count, label]) => {
          const content = `<strong>${count}</strong><small>${label}</small>`;
          return tab ? `<button class="data-tile ${count === '—' ? 'unavailable' : ''}" data-tab="${tab}">${content}</button>` : `<div class="data-tile">${content}</div>`;
        }).join('');
        return `<section class="tab-panel">
          <div class="signal-grid">
            <article class="signal-card"><div class="signal-title"><div><span class="signal-icon">✓</span><h2>Food rules</h2></div><span class="count-badge">${restrictions.length} saved</span></div><div class="chip-cloud">${ruleChips || '<span class="chip allow">No restrictions saved</span>'}</div></article>
            <article class="signal-card"><div class="signal-title"><div><span class="signal-icon">◷</span><h2>Planning defaults</h2></div></div><ul class="fact-list">${(facts.length ? facts : ['No planning defaults saved']).map((fact) => `<li>${escapeHtml(fact)}</li>`).join('')}</ul></article>
          </div>
          <article class="signal-card"><div class="signal-title"><div><span class="signal-icon">⌂</span><h2>Preferred stores</h2></div><span class="count-badge">in order</span></div><div class="store-row">${storeMarkup || '<span class="store">None saved</span>'}</div></article>
          <div class="data-strip">${tiles}</div>
        </section>`;
      }

      function unavailable(title) {
        return `<div class="callout"><strong>${escapeHtml(title)} is not available yet</strong><p>The household profile is still usable. This section will appear once its database table is installed.</p></div>`;
      }

      function renderPantry() {
        if (sectionStatus('pantry') === 'unavailable') return unavailable('Pantry');
        const items = asArray(sectionValue('pantry'));
        if (!items.length) return '<div class="callout"><strong>No pantry items saved</strong><p>Add ingredients as they arrive; Meal Prep can then use them in plans and avoid duplicate shopping.</p></div>';
        const rows = items.slice(0, 8).map((item) => `<div class="compact-row"><div><strong>${escapeHtml(item.name)}</strong><small>${escapeHtml(item.storage_location || item.storageLocation || 'Pantry')} · ${escapeHtml(item.quantity_confidence || item.quantityConfidence || 'quantity not verified')}</small></div><span class="row-meta">${escapeHtml(item.quantity || '')} ${escapeHtml(item.unit || '')}</span></div>`).join('');
        return `<section class="tab-panel"><div class="section-head"><h2>Pantry inventory</h2><span>${items.length} item${items.length === 1 ? '' : 's'}</span></div><div class="compact-list">${rows}</div></section>`;
      }

      function recipeTime(recipe) {
        return pick(recipe, 'totalMinutes', 'total_minutes', 'activeMinutes', 'active_minutes');
      }

      function recipeInitial(recipe) {
        return String(recipe.title || 'Recipe').trim().slice(0, 1).toUpperCase();
      }

      function ingredientParts(ingredient) {
        if (typeof ingredient === 'string') return { name: ingredient, amount: '' };
        const quantity = pick(ingredient, 'quantity', 'amount');
        const unit = pick(ingredient, 'unit', 'measurement');
        return {
          name: pick(ingredient, 'name', 'ingredient', 'item') || 'Ingredient',
          amount: [quantity, unit].filter((value) => value !== undefined && value !== null && value !== '').join(' '),
        };
      }

      function instructionText(instruction) {
        return typeof instruction === 'string' ? instruction : pick(instruction, 'text', 'instruction', 'description', 'step') || '';
      }

      function renderRecipeCards(recipes) {
        if (!recipes.length) return '<div class="callout"><strong>No matching recipes</strong><p>Try a different title, description, or tag.</p></div>';
        return `<div class="recipe-grid">${recipes.map((recipe) => {
          const time = recipeTime(recipe);
          const servings = pick(recipe, 'servings', 'yield');
          const ingredients = asArray(recipe.ingredients);
          const tags = asArray(recipe.tags).slice(0, 3);
          return `<button class="recipe-card" data-recipe-id="${escapeHtml(recipe.id)}" aria-label="Open ${escapeHtml(recipe.title || 'recipe')}">
            <span class="recipe-art" aria-hidden="true">${escapeHtml(recipeInitial(recipe))}</span>
            <span class="recipe-card-copy"><h3>${escapeHtml(recipe.title || 'Untitled recipe')}</h3><p>${escapeHtml(recipe.description || 'Saved recipe')}</p>
            <span class="recipe-facts">${time ? `<span>◷ ${escapeHtml(time)} min</span>` : ''}${servings ? `<span>♙ ${escapeHtml(servings)} servings</span>` : ''}${ingredients.length ? `<span>${ingredients.length} ingredients</span>` : ''}</span>
            ${tags.length ? `<span class="recipe-tags">${tags.map((tag) => `<span class="recipe-tag">${escapeHtml(tag)}</span>`).join('')}</span>` : ''}</span>
          </button>`;
        }).join('')}</div>`;
      }

      function renderRecipeLibrary(recipes, options = {}) {
        recipeLibrary = recipes;
        const title = options.title || 'Your recipes';
        return `<section class="recipe-library">
          <div class="recipe-library-head"><div><h1>${escapeHtml(title)}</h1><p><span id="recipe-count">${recipes.length}</span> saved recipe${recipes.length === 1 ? '' : 's'} · select one to see the full recipe</p></div>
          <label class="recipe-search"><span aria-hidden="true">⌕</span><input id="recipe-search" type="search" placeholder="Search recipes" aria-label="Search recipes"></label></div>
          <div id="recipe-results">${recipes.length ? renderRecipeCards(recipes) : '<div class="callout"><strong>No saved recipes yet</strong><p>Recipes you save will appear here as visual cards with ingredients and instructions.</p></div>'}</div>
        </section>`;
      }

      function renderRecipeDetail(recipe) {
        const ingredients = asArray(recipe.ingredients);
        const instructions = asArray(recipe.instructions);
        const time = recipeTime(recipe);
        const active = pick(recipe, 'activeMinutes', 'active_minutes');
        const servings = pick(recipe, 'servings', 'yield');
        const tags = asArray(recipe.tags);
        const sourceUrl = safeHttpUrl(pick(recipe, 'sourceUrl', 'source_url'));
        const sourceType = pick(recipe, 'sourceType', 'source_type');
        const feedback = asArray(recipe.feedback).slice(0, 4);
        const facts = [time ? `◷ ${time} min total` : '', active && active !== time ? `${active} min active` : '', servings ? `${servings} servings` : ''].filter(Boolean);
        const ingredientMarkup = ingredients.length ? ingredients.map((ingredient) => { const part = ingredientParts(ingredient); return `<li><span>${escapeHtml(part.name)}</span><small>${escapeHtml(part.amount)}</small></li>`; }).join('') : '<li><span>Ingredients have not been added yet.</span></li>';
        const instructionMarkup = instructions.length ? instructions.map((instruction) => `<li><span>${escapeHtml(instructionText(instruction))}</span></li>`).join('') : '<li><span>Instructions have not been added yet.</span></li>';
        return `<section class="recipe-detail">
          <button class="recipe-back" data-recipe-back>← All recipes</button>
          <div class="recipe-hero"><span class="recipe-art" aria-hidden="true">${escapeHtml(recipeInitial(recipe))}</span><div><h1>${escapeHtml(recipe.title || 'Untitled recipe')}</h1><p>${escapeHtml(recipe.description || 'Saved recipe')}</p><div class="recipe-facts">${facts.map((fact) => `<span>${escapeHtml(fact)}</span>`).join('')}</div>${tags.length ? `<div class="recipe-tags">${tags.map((tag) => `<span class="recipe-tag">${escapeHtml(tag)}</span>`).join('')}</div>` : ''}</div></div>
          <div class="recipe-columns"><section class="recipe-section"><h2>Ingredients</h2><ul class="recipe-list">${ingredientMarkup}</ul></section><section class="recipe-section"><h2>Instructions</h2><ol class="recipe-steps">${instructionMarkup}</ol></section></div>
          ${feedback.length ? `<section class="recipe-section"><h2>Cooking notes</h2><div class="recipe-notes">${feedback.map((item) => `<article class="recipe-note"><p>${escapeHtml(item.note || item.content || 'Saved feedback')}</p>${pick(item, 'nextTime', 'next_time') ? `<small>Next time: ${escapeHtml(pick(item, 'nextTime', 'next_time'))}</small>` : ''}</article>`).join('')}</div></section>` : ''}
          ${sourceUrl ? `<a class="recipe-source" href="${escapeHtml(sourceUrl)}" target="_blank" rel="noreferrer">Open original recipe ↗</a>` : sourceType ? `<span class="recipe-source">Source: ${escapeHtml(humanize(sourceType))}</span>` : ''}
        </section>`;
      }

      function renderRecipesTab() {
        if (sectionStatus('recipes') === 'unavailable') return unavailable('Recipes');
        return renderRecipeLibrary(asArray(sectionValue('recipes')), { title: 'Recipe library' });
      }

      function renderWeek() {
        const scheduleState = sectionStatus('schedule');
        const schedule = sectionValue('schedule');
        const plan = sectionValue('mealPlan');
        const scheduleMarkup = scheduleState === 'unavailable' ? unavailable('Weekly schedule') : !schedule ? '<div class="callout"><strong>No weekly rhythm saved</strong><p>Meal Prep will ask before using a schedule as a recurring default.</p></div>' : `<div class="week-grid">${asArray(schedule.days).map((day) => `<div class="week-day"><strong>${escapeHtml(String(day.day || '').slice(0, 3))}</strong><small>${escapeHtml(humanize(day.mode))}</small></div>`).join('')}</div>`;
        const planRows = asArray(plan?.entries).slice(0, 4).map((entry) => `<div class="compact-row"><div><strong>${escapeHtml(entry.meal || entry.title)}</strong><small>${escapeHtml(entry.day || entry.date)}</small></div><span class="row-meta">${escapeHtml(entry.servings || '')}${entry.servings ? ' servings' : ''}</span></div>`).join('');
        return `<section class="tab-panel"><div class="section-head"><h2>Weekly rhythm</h2><span>${schedule?.is_normal_week === false ? 'Different week' : 'Usual week'}</span></div>${scheduleMarkup}<div class="section-head"><h2>Saved meal plan</h2><span>${planRows ? `${asArray(plan.entries).length} meals` : 'Empty'}</span></div>${planRows ? `<div class="compact-list">${planRows}</div>` : '<div class="callout"><strong>No meal plan saved</strong><p>Approved weekly plans will appear here.</p></div>'}</section>`;
      }

      function renderMemory() {
        if (sectionStatus('memories') === 'unavailable') return unavailable('Learned memory');
        const memories = asArray(sectionValue('memories'));
        if (!memories.length) return '<div class="callout"><strong>No learned memories yet</strong><p>Confirmed patterns and reviewable suggestions from retrospectives or feedback will appear here.</p></div>';
        const rows = memories.slice(0, 6).map((item) => `<article class="memory-row"><div class="memory-meta"><span>${escapeHtml(humanize(item.category || 'planning'))}</span><span class="status ${item.status === 'suggested' ? 'suggested' : ''}">${escapeHtml(item.status || 'confirmed')}</span></div><p>${escapeHtml(item.content)}</p></article>`).join('');
        return `<section class="tab-panel"><div class="section-head"><h2>Learned memory</h2><span>${memories.length} active</span></div><div class="compact-list">${rows}</div></section>`;
      }

      function reflectionText(item) {
        return typeof item === 'string' ? item : pick(item, 'meal', 'title', 'note', 'outcome') || humanize(item);
      }

      function renderReviews() {
        const retroUnavailable = sectionStatus('retro') === 'unavailable';
        const feedbackUnavailable = sectionStatus('feedback') === 'unavailable';
        if (retroUnavailable && feedbackUnavailable) return unavailable('Reviews');
        const retro = sectionValue('retro');
        const feedback = asArray(sectionValue('feedback'));
        if (!retro && !feedback.length) return '<div class="callout"><strong>No reviews saved yet</strong><p>Weekly retrospectives and meal feedback will appear here without being promoted to long-term memory.</p></div>';

        let retroMarkup = '';
        if (retro) {
          const workedWell = asArray(pick(retro, 'workedWell', 'worked_well'));
          const stressors = asArray(retro.stressors);
          const outcomes = asArray(retro.outcomes);
          const workedMarkup = workedWell.length ? workedWell.map((item) => `<li><span>${escapeHtml(reflectionText(item))}</span></li>`).join('') : '<li><span>No wins recorded for this week.</span></li>';
          const stressMarkup = stressors.length ? stressors.map((item) => `<li><span>${escapeHtml(reflectionText(item))}</span></li>`).join('') : '<li><span>No stressors recorded for this week.</span></li>';
          const outcomeMarkup = outcomes.map((item) => `<div class="compact-row"><div><strong>${escapeHtml(pick(item, 'meal', 'title', 'name') || 'Meal')}</strong><small>${escapeHtml(item.note || '')}</small></div><span class="row-meta">${escapeHtml(humanize(item.outcome || item.status || 'recorded'))}</span></div>`).join('');
          retroMarkup = `<div class="section-head"><h2>Latest weekly retro</h2><span>Week of ${escapeHtml(pick(retro, 'weekStart', 'week_start') || '')}</span></div>
            ${retro.note ? `<article class="retro-card"><h3>Week note</h3><p>${escapeHtml(retro.note)}</p></article>` : ''}
            <div class="retro-summary"><article class="retro-card"><h3>What worked well</h3><ul class="retro-list">${workedMarkup}</ul></article><article class="retro-card stress"><h3>Friction and stressors</h3><ul class="retro-list">${stressMarkup}</ul></article></div>
            ${outcomeMarkup ? `<div class="section-head"><h2>Meal outcomes</h2><span>${outcomes.length} recorded</span></div><div class="compact-list">${outcomeMarkup}</div>` : ''}`;
        } else if (!retroUnavailable) {
          retroMarkup = '<div class="callout"><strong>No weekly retro saved</strong><p>Your latest end-of-week reflection will appear here.</p></div>';
        }

        const feedbackMarkup = feedback.length ? feedback.slice(0, 8).map((item) => {
          const occurrence = item.occurrence || {};
          const title = occurrence.title || item.meal_title || item.title || 'Meal feedback';
          const type = humanize(item.feedback_type || item.feedbackType || 'feedback');
          const rating = item.rating ? ` · ${escapeHtml(item.rating)}/5` : '';
          const nextTime = pick(item, 'nextTime', 'next_time');
          return `<article class="feedback-row"><div class="feedback-row-head"><strong>${escapeHtml(title)}</strong><small>${escapeHtml(type)}${rating}</small></div><p>${escapeHtml(item.note || item.content || 'Saved feedback')}</p>${nextTime ? `<small class="next-time">Next time: ${escapeHtml(nextTime)}</small>` : ''}</article>`;
        }).join('') : '';
        const feedbackSection = feedbackMarkup ? `<div class="section-head"><h2>Meal feedback</h2><span>${feedback.length} saved</span></div><div class="feedback-list">${feedbackMarkup}</div>` : feedbackUnavailable ? '' : '<div class="callout"><strong>No meal feedback saved</strong><p>Dish-specific wins and next-time adjustments will appear here.</p></div>';
        return `<section class="tab-panel">${retroMarkup}${feedbackSection}</section>`;
      }

      function renderSnapshotTab(tab) {
        const panel = root.querySelector('#snapshot-body');
        if (!panel || !householdSnapshot) return;
        panel.innerHTML = tab === 'pantry' ? renderPantry() : tab === 'recipes' ? renderRecipesTab() : tab === 'week' ? renderWeek() : tab === 'reviews' ? renderReviews() : tab === 'memory' ? renderMemory() : renderOverview();
        root.querySelectorAll('[data-tab].tab-button').forEach((button) => {
          const active = button.dataset.tab === tab;
          button.classList.toggle('active', active);
          button.setAttribute('aria-selected', String(active));
        });
      }

      function renderHouseholdSnapshot(data) {
        householdSnapshot = data;
        const household = data.household || {};
        const name = pick(household, 'householdName', 'household_name', 'name') || 'My household';
        const size = pick(household, 'householdSize', 'household_size');
        const role = pick(household, 'role', 'householdRole', 'household_role') || 'Owner';
        root.innerHTML = `<section class="snapshot"><div class="snapshot-head"><div class="identity"><span class="identity-mark" aria-hidden="true">MP</span><div><h1>${escapeHtml(name)}</h1><p>${size ? `${escapeHtml(size)} people · ` : ''}saved meal-prep context</p></div></div><span class="owner-badge">${escapeHtml(role)}</span></div><nav class="tabs" aria-label="Household data"><button class="tab-button active" data-tab="overview" aria-selected="true">Overview</button><button class="tab-button" data-tab="recipes" aria-selected="false">Recipes</button><button class="tab-button" data-tab="pantry" aria-selected="false">Pantry</button><button class="tab-button" data-tab="week" aria-selected="false">Week</button><button class="tab-button" data-tab="reviews" aria-selected="false">Reviews</button><button class="tab-button" data-tab="memory" aria-selected="false">Memory</button></nav><div id="snapshot-body"></div></section>`;
        renderSnapshotTab('overview');
      }

      function renderOnboarding(household = {}) {
        const preferences = household.planningPreferences || {};
        const focusAreas = new Set(preferences.focusAreas || []);
        const restrictions = (household.dietaryRestrictions || []).join(', ');
        const stores = (household.storePriority || []).sort((a, b) => (a.priority || 0) - (b.priority || 0)).map((item) => item.store).join(', ');
        const areas = [
          ['breakfasts', 'Weekday breakfasts'], ['lunches', 'School or work lunches'],
          ['dinners', 'Family dinners'], ['weekend-prep', 'Weekend prep'],
          ['pantry', 'Pantry inventory'], ['shopping', 'Shopping list'],
        ];
        const areaChoices = areas.map(([value, label]) => `<label class="choice"><input type="checkbox" name="focusAreas" value="${value}"${focusAreas.has(value) ? ' checked' : ''}><span>${label}</span></label>`).join('');
        return `
          <section class="onboarding">
            <div class="onboarding-hero">
              <h1>Feeding a family takes planning.</h1>
              <p>Keep breakfasts, lunches, dinners, weekend prep, pantry, and shopping in one practical weekly plan—built around your household’s actual schedule.</p>
              <div class="coverage" aria-label="Meal Prep planning areas"><span>Breakfast</span><span>Lunch</span><span>Dinner</span><span>Weekend prep</span><span>Pantry</span><span>Shopping</span></div>
            </div>
            <form class="setup-form" id="setup-form">
              <fieldset>
                <legend>What should Meal Prep help manage?</legend>
                <p class="field-note">Choose the parts of the food week you want coordinated.</p>
                <div class="choice-grid">${areaChoices}</div>
              </fieldset>
              <fieldset>
                <legend>Your household</legend>
                <p class="field-note">A few practical details help the first plan fit real life.</p>
                <div class="form-grid">
                  <label class="field">People in the household<input name="householdSize" type="number" min="1" max="30" required value="${escapeHtml(household.householdSize || '')}"></label>
                  <label class="field">Dietary restrictions<input name="dietaryRestrictions" type="text" value="${escapeHtml(restrictions)}" placeholder="Enter none, or separate with commas" required></label>
                  <label class="field">Preferred stores, in order<input name="stores" type="text" value="${escapeHtml(stores)}" placeholder="Costco, Safeway" required></label>
                  <label class="field">Maximum weeknight cooking time<select name="weeknightMaxMinutes">
                    ${[15,20,25,30,45,60].map((minutes) => `<option value="${minutes}"${Number(preferences.weeknightMaxMinutes || 30) === minutes ? ' selected' : ''}>${minutes} minutes</option>`).join('')}
                  </select></label>
                </div>
              </fieldset>
              <fieldset>
                <legend>Should dinner provide lunch leftovers?</legend>
                <div class="choice-grid">
                  <label class="choice"><input type="radio" name="leftoversForLunch" value="true"${preferences.leftoversForLunch !== false ? ' checked' : ''}><span>Yes, plan for leftovers</span></label>
                  <label class="choice"><input type="radio" name="leftoversForLunch" value="false"${preferences.leftoversForLunch === false ? ' checked' : ''}><span>No, keep lunches separate</span></label>
                </div>
              </fieldset>
              <div class="form-actions">
                <p>Dietary restrictions are treated as rules. Everything else stays visible and editable.</p>
                <button type="submit">Save household setup</button>
              </div>
              <p class="form-error" role="alert" hidden></p>
            </form>
          </section>`;
      }

      function renderOnboardingSuccess(household) {
        return `<section class="success" role="status"><h1>Your household setup is saved.</h1><p>Meal Prep can now coordinate the food week around these preferences. You can change them at any time.</p></section>`;
      }

      function applyResult(result) {
        const data = result?.structuredContent || result;
        if (!data) return;
        if (data.kind === 'household_snapshot') renderHouseholdSnapshot(data);
        else if (data.kind === 'onboarding') root.innerHTML = renderOnboarding(data.household);
        else if (data.kind === 'recipe_library') root.innerHTML = renderRecipeLibrary(asArray(data.recipes));
        else if (data.kind === 'household_reviews') {
          householdSnapshot = { sections: data.sections || {} };
          root.innerHTML = renderReviews();
        }
        else if (data.kind === 'shopping_list') root.innerHTML = renderShopping(data.shoppingList);
        else if (data.kind === 'meal_plan') root.innerHTML = renderPlan(data.plan);
        else if (data.onboardingCompletedAt) root.innerHTML = renderOnboardingSuccess(data);
      }

      window.addEventListener('message', (event) => {
        if (event.source !== window.parent) return;
        const message = event.data;
        if (!message || message.jsonrpc !== '2.0') return;
        if (pending.has(message.id)) {
          const job = pending.get(message.id); pending.delete(message.id);
          message.error ? job.reject(message.error) : job.resolve(message.result);
          return;
        }
        if (message.method === 'ui/notifications/tool-result') applyResult(message.params);
      }, { passive: true });

      root.addEventListener('click', async (event) => {
        const tab = event.target.closest('[data-tab]');
        if (tab) {
          renderSnapshotTab(tab.dataset.tab);
          return;
        }
        const recipeCard = event.target.closest('[data-recipe-id]');
        if (recipeCard) {
          const recipe = recipeLibrary.find((item) => String(item.id) === recipeCard.dataset.recipeId);
          const target = root.querySelector('#snapshot-body') || root;
          if (recipe) {
            recipeCard.disabled = true;
            try {
              const result = await rpc('tools/call', { name: 'get_recipe', arguments: { recipe_id: recipe.id } });
              target.innerHTML = renderRecipeDetail(result?.structuredContent || result || recipe);
            } catch {
              target.innerHTML = renderRecipeDetail(recipe);
            }
          }
          return;
        }
        if (event.target.closest('[data-recipe-back]')) {
          if (root.querySelector('#snapshot-body')) renderSnapshotTab('recipes');
          else root.innerHTML = renderRecipeLibrary(recipeLibrary);
        }
      });

      root.addEventListener('input', (event) => {
        if (!event.target.matches('#recipe-search')) return;
        const query = event.target.value.trim().toLowerCase();
        const matches = recipeLibrary.filter((recipe) => [recipe.title, recipe.description, ...asArray(recipe.tags)].some((value) => String(value || '').toLowerCase().includes(query)));
        const results = root.querySelector('#recipe-results');
        const count = root.querySelector('#recipe-count');
        if (results) results.innerHTML = renderRecipeCards(matches);
        if (count) count.textContent = String(matches.length);
      });

      root.addEventListener('change', async (event) => {
        const input = event.target.closest('input[data-item-id]');
        if (!input) return;
        input.disabled = true;
        try {
          await rpc('tools/call', { name: 'mark_item_purchased', arguments: { item_id: input.dataset.itemId, purchased: input.checked } });
          input.closest('label').classList.toggle('done', input.checked);
        } finally { input.disabled = false; }
      });

      root.addEventListener('submit', async (event) => {
        if (!event.target.matches('#setup-form')) return;
        event.preventDefault();
        const formElement = event.target;
        const form = new FormData(formElement);
        const submit = formElement.querySelector('button[type="submit"]');
        const error = formElement.querySelector('.form-error');
        const restrictionText = String(form.get('dietaryRestrictions') || '').trim();
        const dietaryRestrictions = /^(none|no restrictions)$/i.test(restrictionText)
          ? []
          : restrictionText.split(',').map((value) => value.trim()).filter(Boolean);
        const storeNames = String(form.get('stores') || '').split(',').map((value) => value.trim()).filter(Boolean);
        if (!storeNames.length) {
          error.textContent = 'Add at least one preferred store.';
          error.hidden = false;
          return;
        }
        submit.disabled = true;
        submit.textContent = 'Saving…';
        error.hidden = true;
        try {
          const result = await rpc('tools/call', {
            name: 'update_household_preferences',
            arguments: {
              household_size: Number(form.get('householdSize')),
              dietary_restrictions: dietaryRestrictions,
              store_priority: storeNames.map((store, index) => ({ store, priority: index + 1 })),
              planning_preferences: {
                weeknightMaxMinutes: Number(form.get('weeknightMaxMinutes')),
                leftoversForLunch: form.get('leftoversForLunch') === 'true',
                focusAreas: form.getAll('focusAreas'),
              },
              complete_onboarding: true,
            },
          });
          const data = result?.structuredContent || result;
          root.innerHTML = renderOnboardingSuccess(data);
        } catch (reason) {
          error.textContent = reason?.message || 'We could not save the household setup. Please try again.';
          error.hidden = false;
          submit.disabled = false;
          submit.textContent = 'Save household setup';
        }
      });

      async function initializeBridge() {
        try {
          await rpc('ui/initialize', {
            protocolVersion: '2026-01-26',
            appCapabilities: {},
            appInfo: { name: 'meal-prep-ui', version: '1.5.0' },
          });
          notify('ui/notifications/initialized');
        } catch (reason) {
          root.innerHTML = '<div class="empty" role="alert">Meal Prep could not connect to the chat. Close and reopen this result to try again.</div>';
        }
      }

      initializeBridge();
    </script>
  </body>
</html>
