<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#252a40" />
    <title>Meal Prep</title>
    <link rel="icon" type="image/svg+xml" href="/static/meal-prep-icon.svg" />
    <link rel="stylesheet" href="/static/typography.css?v=1" />
    <link rel="stylesheet" href="/static/app.css?v=17" />
    <link rel="stylesheet" href="/static/choices.css?v=1" />
    <script src="/static/vendor/supabase.js" defer></script>
    <script src="/static/choices.js?v=1" defer></script>
    <script src="/static/app.js?v=19" defer></script>
  </head>
  <body>
    <svg class="icon-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <symbol id="icon-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z" /></symbol>
      <symbol id="icon-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2" /><path d="M7 3v4m10-4v4M3 10h18M8 14h3m-3 3h7" /></symbol>
      <symbol id="icon-recipes" viewBox="0 0 24 24"><path d="M12 20c-2-1.5-5-2-9-1.5v-14C7 4 10 4.5 12 6c2-1.5 5-2 9-1.5v14c-4-.5-7 0-9 1.5ZM12 6v14" /></symbol>
      <symbol id="icon-pantry" viewBox="0 0 24 24"><path d="M6 3h12v3H6zM7 6 6 9v10a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V9l-1-3M9 12h6m-6 3h6" /></symbol>
      <symbol id="icon-shopping" viewBox="0 0 24 24"><path d="M4 8h16l-1 12H5L4 8ZM9 9V6a3 3 0 0 1 6 0v3" /></symbol>
      <symbol id="icon-reviews" viewBox="0 0 24 24"><path d="M4 4h16v13H9l-5 4V4Z" /><path d="M12 14s-3-1.8-3-3.5c0-1.4 1.7-2 3-.4 1.3-1.6 3-1 3 .4 0 1.7-3 3.5Z" /></symbol>
      <symbol id="icon-settings" viewBox="0 0 24 24"><path d="M4 7h9m4 0h3M4 17h3m4 0h9" /><circle cx="15" cy="7" r="2" /><circle cx="9" cy="17" r="2" /></symbol>
      <symbol id="icon-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9ZM10 21h4" /></symbol>
    </svg>
    <div class="shell">
      <aside class="sidebar">
        <div class="sidebar-head">
          <a class="brand" href="/app" aria-label="Meal Prep app home" title="Meal Prep app home">
            <span class="brand-logo-frame"><img class="brand-logo" src="/static/meal-prep-icon.svg" alt="" /></span>
            <span class="brand-name">Meal Prep</span>
          </a>
          <button class="sidebar-toggle" id="sidebar-toggle" type="button" aria-label="Collapse sidebar" aria-expanded="true" aria-controls="primary-nav" title="Collapse sidebar"><span aria-hidden="true">←</span></button>
        </div>
        <nav id="primary-nav" aria-label="Main navigation">
          <button class="nav-item active" data-view="overview" aria-label="Overview" title="Overview"><span class="nav-icon" aria-hidden="true"><svg class="nav-svg"><use href="#icon-home" /></svg></span><span class="nav-label">Overview</span></button>
          <button class="nav-item" data-view="plan" aria-label="Weekly plan" title="Weekly plan"><span class="nav-icon" aria-hidden="true"><svg class="nav-svg"><use href="#icon-calendar" /></svg></span><span class="nav-label">Weekly plan</span></button>
          <button class="nav-item" data-view="recipes" aria-label="Recipes" title="Recipes"><span class="nav-icon" aria-hidden="true"><svg class="nav-svg"><use href="#icon-recipes" /></svg></span><span class="nav-label">Recipes</span></button>
          <button class="nav-item" data-view="pantry" aria-label="Pantry" title="Pantry"><span class="nav-icon" aria-hidden="true"><svg class="nav-svg"><use href="#icon-pantry" /></svg></span><span class="nav-label">Pantry</span></button>
          <button class="nav-item" data-view="shopping" aria-label="Shopping" title="Shopping"><span class="nav-icon" aria-hidden="true"><svg class="nav-svg"><use href="#icon-shopping" /></svg></span><span class="nav-label">Shopping</span></button>
          <button class="nav-item" data-view="reviews" aria-label="Reviews" title="Reviews"><span class="nav-icon" aria-hidden="true"><svg class="nav-svg"><use href="#icon-reviews" /></svg></span><span class="nav-label">Reviews</span></button>
        </nav>
        <div class="sidebar-foot">
          <button class="nav-item" data-view="settings" aria-label="Settings" title="Settings"><span class="nav-icon" aria-hidden="true"><svg class="nav-svg"><use href="#icon-settings" /></svg></span><span class="nav-label">Settings</span></button>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <p class="eyebrow" id="view-eyebrow">Your household</p>
            <h1 id="view-title">Overview</h1>
          </div>
          <div class="top-actions">
            <span class="mode-badge" id="mode-badge" hidden>Demo data</span>
            <div class="household-picker" id="household-picker" hidden><span id="household-choice-label">Household</span><div id="household-choice"></div></div>
            <button class="icon-button notification-button" id="notifications-button" type="button" aria-label="Notifications" title="Notifications"><svg class="nav-svg" aria-hidden="true"><use href="#icon-bell" /></svg><span id="notification-count" class="notification-count" hidden></span></button>
            <button class="icon-button" id="refresh-button" aria-label="Refresh data">↻</button>
            <button class="account-button" id="account-button" aria-label="Account settings"><span id="account-avatar">MP</span><span id="account-label">Account</span></button>
          </div>
        </header>
        <section id="app-content" class="content" aria-live="polite">
          <div class="loading"><span class="loader"></span><b>Opening your kitchen…</b></div>
        </section>
      </main>
    </div>

    <nav class="mobile-nav" aria-label="Mobile navigation">
      <button class="active" data-view="overview"><svg class="nav-svg" aria-hidden="true"><use href="#icon-home" /></svg>Home</button>
      <button data-view="plan"><svg class="nav-svg" aria-hidden="true"><use href="#icon-calendar" /></svg>Plan</button>
      <button data-view="recipes"><svg class="nav-svg" aria-hidden="true"><use href="#icon-recipes" /></svg>Recipes</button>
      <button data-view="pantry"><svg class="nav-svg" aria-hidden="true"><use href="#icon-pantry" /></svg>Pantry</button>
      <button data-view="shopping"><svg class="nav-svg" aria-hidden="true"><use href="#icon-shopping" /></svg>Shop</button>
      <button data-view="reviews"><svg class="nav-svg" aria-hidden="true"><use href="#icon-reviews" /></svg>Reviews</button>
    </nav>

    <dialog id="editor-dialog">
      <form method="dialog" class="dialog-card" id="editor-form">
        <div class="dialog-head"><div><p class="eyebrow" id="dialog-eyebrow">Meal Prep</p><h2 id="dialog-title">Edit</h2></div><button class="icon-button" type="submit" value="cancel" formnovalidate aria-label="Close">×</button></div>
        <div id="dialog-fields" class="dialog-fields"></div>
        <p class="form-error" id="dialog-error" role="alert" hidden></p>
        <div class="dialog-actions"><button class="button ghost" type="submit" value="cancel" formnovalidate>Cancel</button><button class="button primary" id="dialog-save" type="submit">Save</button></div>
      </form>
    </dialog>
    <div class="toast" id="toast" role="status"></div>
  </body>
</html>
