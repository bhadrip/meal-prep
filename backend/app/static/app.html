<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#252a40" />
    <title>Meal Prep</title>
    <link rel="icon" type="image/svg+xml" href="/static/meal-prep-icon.svg" />
    <link rel="stylesheet" href="/static/typography.css?v=1" />
    <link rel="stylesheet" href="/static/app.css?v=6" />
    <script src="/static/vendor/supabase.js" defer></script>
    <script src="/static/app.js?v=6" defer></script>
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="sidebar-head">
          <a class="brand" href="/" aria-label="Meal Prep home" title="Meal Prep home">
            <span class="brand-logo-frame"><img class="brand-logo" src="/static/meal-prep-icon.svg" alt="" /></span>
            <span class="brand-name">Meal Prep</span>
          </a>
          <button class="sidebar-toggle" id="sidebar-toggle" type="button" aria-label="Collapse sidebar" aria-expanded="true" aria-controls="primary-nav" title="Collapse sidebar"><span aria-hidden="true">←</span></button>
        </div>
        <nav id="primary-nav" aria-label="Main navigation">
          <button class="nav-item active" data-view="overview" aria-label="Overview" title="Overview"><span class="nav-icon" aria-hidden="true">⌂</span><span class="nav-label">Overview</span></button>
          <button class="nav-item" data-view="plan" aria-label="Weekly plan" title="Weekly plan"><span class="nav-icon" aria-hidden="true">▦</span><span class="nav-label">Weekly plan</span></button>
          <button class="nav-item" data-view="recipes" aria-label="Recipes" title="Recipes"><span class="nav-icon" aria-hidden="true">◇</span><span class="nav-label">Recipes</span></button>
          <button class="nav-item" data-view="pantry" aria-label="Pantry" title="Pantry"><span class="nav-icon" aria-hidden="true">□</span><span class="nav-label">Pantry</span></button>
          <button class="nav-item" data-view="shopping" aria-label="Shopping" title="Shopping"><span class="nav-icon" aria-hidden="true">✓</span><span class="nav-label">Shopping</span></button>
          <button class="nav-item" data-view="reviews" aria-label="Reviews" title="Reviews"><span class="nav-icon" aria-hidden="true">♡</span><span class="nav-label">Reviews</span></button>
        </nav>
        <div class="sidebar-foot">
          <button class="nav-item" data-view="settings" aria-label="Settings" title="Settings"><span class="nav-icon" aria-hidden="true">⚙</span><span class="nav-label">Settings</span></button>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <p class="eyebrow" id="view-eyebrow">Your household</p>
            <h1 id="view-title">Overview</h1>
          </div>
          <div class="top-actions">
            <span class="mode-badge" id="mode-badge" hidden>Demo data</span>
            <button class="icon-button" id="refresh-button" aria-label="Refresh data">↻</button>
            <button class="account-button" id="account-button" aria-label="Account settings"><span id="account-avatar">MP</span><span id="account-label">Account</span></button>
          </div>
        </header>
        <section id="app-content" class="content" aria-live="polite">
          <div class="loading"><span class="loader"></span><b>Opening your kitchen…</b></div>
        </section>
      </main>
    </div>

    <nav class="mobile-nav" aria-label="Mobile navigation">
      <button class="active" data-view="overview"><span>⌂</span>Home</button>
      <button data-view="plan"><span>▦</span>Plan</button>
      <button data-view="recipes"><span>◇</span>Recipes</button>
      <button data-view="pantry"><span>□</span>Pantry</button>
      <button data-view="shopping"><span>✓</span>Shop</button>
    </nav>

    <dialog id="editor-dialog">
      <form method="dialog" class="dialog-card" id="editor-form">
        <div class="dialog-head"><div><p class="eyebrow" id="dialog-eyebrow">Meal Prep</p><h2 id="dialog-title">Edit</h2></div><button class="icon-button" type="button" data-dialog-close aria-label="Close">×</button></div>
        <div id="dialog-fields" class="dialog-fields"></div>
        <p class="form-error" id="dialog-error" role="alert" hidden></p>
        <div class="dialog-actions"><button class="button ghost" type="button" data-dialog-close>Cancel</button><button class="button primary" id="dialog-save" type="submit">Save</button></div>
      </form>
    </dialog>
    <div class="toast" id="toast" role="status"></div>
  </body>
</html>
