project_id = "meal-prep"

[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55322
major_version = 17

[studio]
port = 55323

[auth]
enabled = true
site_url = "http://127.0.0.1:8000"
additional_redirect_urls = ["http://127.0.0.1:8000/login", "http://localhost:8000/login", "http://127.0.0.1:8000/invite", "http://localhost:8000/invite"]

[auth.email]
enable_signup = true
enable_confirmations = false

[auth.oauth_server]
enabled = true
authorization_url_path = "/oauth/consent"
allow_dynamic_registration = true

# Supabase's local email test inbox is available at http://127.0.0.1:55324.
[inbucket]
enabled = true
port = 55324
