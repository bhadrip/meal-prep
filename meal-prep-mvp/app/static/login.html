<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in · Meal Prep</title>
    <style>
      :root { font-family: ui-sans-serif, system-ui, sans-serif; color:#17211e; background:#f5f7f2; }
      * { box-sizing:border-box; }
      body { min-height:100vh; margin:0; display:grid; place-items:center; padding:24px; }
      main { width:min(460px,100%); background:white; border:1px solid #dfe5de; border-radius:24px; padding:32px; box-shadow:0 18px 45px rgba(29,56,47,.1); }
      h1 { margin:0; font-family:Georgia,serif; font-size:2rem; }
      p { color:#64716c; line-height:1.5; }
      form { display:grid; gap:12px; margin-top:24px; }
      label { font-weight:700; }
      input,button { min-height:48px; border-radius:12px; font:inherit; }
      input { border:1px solid #cfd8d2; padding:0 14px; }
      button { border:0; background:#173f35; color:white; font-weight:700; cursor:pointer; }
      a { color:#173f35; }
      #message { min-height:24px; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="/static/login.js" defer></script>
  </head>
  <body>
    <main>
      <a href="/">← Meal Prep service</a>
      <h1>Sign in</h1>
      <p>Use a magic link to access your household data. The same account authorizes ChatGPT and Codex through Supabase OAuth.</p>
      <form id="login-form">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com" />
        <button type="submit">Send magic link</button>
      </form>
      <p id="message" role="status"></p>
    </main>
  </body>
</html>
